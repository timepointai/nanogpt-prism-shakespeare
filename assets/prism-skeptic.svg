<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-label="The decisive cross-data test: if the teacher's fingerprint comes from a disjoint split and the advantage survives, the transfer is structural; if it collapses, Prism is leaking content.">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="880" height="340" rx="14" fill="#0b1220"/>

  <text x="32" y="44" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="600" fill="#e2e8f0">The experiment that decides it</text>
  <text x="32" y="68" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#94a3b8">Everything rests on one question: is Prism moving structure, or quietly moving content?</text>

  <!-- same-data arm -->
  <rect x="32" y="96" width="396" height="150" rx="10" fill="#111c31" stroke="#334155"/>
  <text x="52" y="124" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#94a3b8">What the eval does today</text>
  <rect x="52" y="140" width="150" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="127" y="165" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#e2e8f0">Teacher · split A</text>
  <rect x="258" y="140" width="150" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="333" y="165" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#e2e8f0">Student · split A</text>
  <line x1="204" y1="160" x2="254" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="52" y="206" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#f87171">Same data. A win here proves nothing:</text>
  <text x="52" y="224" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#94a3b8">the teacher may simply be handing over answers.</text>

  <!-- cross-data arm -->
  <rect x="452" y="96" width="396" height="150" rx="10" fill="#111c31" stroke="#2dd4bf" stroke-opacity="0.5"/>
  <text x="472" y="124" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#2dd4bf">What has to be run</text>
  <rect x="472" y="140" width="150" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="547" y="165" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#e2e8f0">Teacher · split A</text>
  <rect x="678" y="140" width="150" height="40" rx="6" fill="#1e293b" stroke="#2dd4bf" stroke-opacity="0.6"/>
  <text x="753" y="165" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#e2e8f0">Student · split B</text>
  <line x1="624" y1="160" x2="674" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="472" y="206" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#94a3b8">Disjoint data. There is no content to leak —</text>
  <text x="472" y="224" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#94a3b8">only geometry can cross the gap.</text>

  <!-- verdict -->
  <rect x="32" y="258" width="816" height="66" rx="10" fill="#111c31" stroke="#334155"/>
  <circle cx="60" cy="281" r="5" fill="#2dd4bf"/>
  <text x="76" y="286" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#94a3b8">Advantage survives → the transfer is structural, and every checkpoint ever trained holds a reusable prior.</text>
  <circle cx="60" cy="307" r="5" fill="#f87171"/>
  <text x="76" y="312" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#94a3b8">Advantage collapses → Prism is distillation with extra steps, and the method should be abandoned.</text>
</svg>

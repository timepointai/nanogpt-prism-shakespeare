<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-label="How Prism works: SVD a trained teacher into directions and a spectrum, inject both into a fresh student, then hold the student toward the spectral target with the mod wheel.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="880" height="420" rx="14" fill="#0b1220"/>

  <text x="32" y="44" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="600" fill="#e2e8f0">How Prism works</text>
  <text x="32" y="68" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#94a3b8">Take the organization of a trained model. Give it to a fresh one. Keep the content out.</text>

  <!-- teacher -->
  <rect x="32" y="112" width="150" height="92" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="107" y="144" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" letter-spacing="1.5" fill="#64748b">TRAINED</text>
  <text x="107" y="167" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="600" fill="#e2e8f0">Teacher</text>
  <text x="107" y="188" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#64748b">a checkpoint</text>

  <line x1="184" y1="158" x2="226" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- svd -->
  <rect x="230" y="126" width="76" height="64" rx="10" fill="#1e293b" stroke="#2dd4bf" stroke-opacity="0.6"/>
  <text x="268" y="164" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="600" fill="#2dd4bf">SVD</text>

  <!-- split -->
  <path d="M308 158 L340 158 L340 122 L372 122" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M308 158 L340 158 L340 196 L372 196" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- directions -->
  <rect x="376" y="96" width="230" height="52" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-opacity="0.55"/>
  <text x="392" y="119" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Directions — U, V</text>
  <text x="392" y="137" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#94a3b8">which subspaces matter · ~500 MB</text>

  <!-- spectrum -->
  <rect x="376" y="170" width="230" height="52" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.55"/>
  <text x="392" y="193" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Spectrum — σ, DCT×8</text>
  <text x="392" y="211" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#94a3b8">how energy is spread · 128 bytes</text>

  <!-- merge -->
  <path d="M610 122 L646 122 L646 158 L682 158" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M610 196 L646 196 L646 158" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- student -->
  <rect x="686" y="112" width="162" height="92" rx="10" fill="#1e293b" stroke="#2dd4bf"/>
  <text x="767" y="144" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" letter-spacing="1.5" fill="#64748b">FRESH</text>
  <text x="767" y="167" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="600" fill="#e2e8f0">Student</text>
  <text x="767" y="188" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#64748b">learns its own content</text>

  <!-- mod wheel loop -->
  <path d="M767 206 L767 236 L392 236 L392 262" fill="none" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <rect x="32" y="266" width="816" height="70" rx="10" fill="#111c31" stroke="#fbbf24" stroke-opacity="0.35"/>
  <text x="52" y="294" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#fbbf24">Mod Wheel</text>
  <text x="52" y="315" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#94a3b8">After every optimizer step, pull the weights back toward the spectral target — strength 0.01, decay 0.9999.</text>
  <text x="52" y="331" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#64748b">A regularizer. Whether it beats tuned dropout and weight decay at that job is untested.</text>

  <text x="32" y="372" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#64748b">The byte sizes are arithmetic. Every speed and quality claim is unmeasured — see Status.</text>
  <text x="32" y="392" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#64748b">Note the asymmetry: the 128-byte spectrum is the headline, but the ~500 MB of directions is where the method's weight sits.</text>
</svg>

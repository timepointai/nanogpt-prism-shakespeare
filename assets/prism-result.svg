    <line x1="332" y1="104" x2="356" y2="104" stroke="#f472b6" stroke-width="2.8"/>
    <text x="364" y="108" font-size="11" fill="#cbd5e1">baseline — nanoGPT default (LR 1e-3)</text>
    <line x1="332" y1="122" x2="356" y2="122" stroke="#2dd4bf" stroke-width="2.8"/>
    <text x="364" y="126" font-size="11" fill="#cbd5e1">recipe (LR 5e-4)</text>
    <line x1="332" y1="140" x2="356" y2="140" stroke="#99f6e4" stroke-width="2.2" stroke-dasharray="6 4"/>
    <text x="364" y="144" font-size="11" fill="#cbd5e1">recipe at the baseline's LR (1e-3) — only spectral flags differ</text>


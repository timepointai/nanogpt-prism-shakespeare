<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 572" role="img" aria-label="Validation loss over training on nanoGPT Shakespeare, three seeds each, real committed data. The baseline (nanoGPT default, LR 1e-3) falls to its best of ~1.78 near step 1,400 and then overfits, rising to ~2.30 by step 5,000. The Prism recipe at LR 5e-4 holds a flat floor of ~1.66; the Prism recipe run at the baseline's own LR of 1e-3 — where only the spectral flags differ — holds ~1.67 and also never overfits. So the effect is attributable to the spectral method, not the learning rate. Bands are the min-to-max range across seeds; lines are medians.">
  <defs>
    <marker id="rar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="572" rx="14" fill="#0b1220"/>

  <text x="40" y="44" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="21" font-weight="600" fill="#e2e8f0">The effect is the method, not the learning rate</text>
  <text x="40" y="68" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#94a3b8">Validation loss · nanoGPT Shakespeare · 3 seeds each · recipe holds low at both LRs, incl. the baseline's own (1e-3)</text>


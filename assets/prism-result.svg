  <!-- caption -->
  <text x="40" y="533" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#cbd5e1">At the baseline's own learning rate — only the spectral flags changed — the recipe still reaches ~1.67 and never overfits.</text>
  <text x="40" y="553" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#64748b">Still open: same-data (structure vs. content leakage) and spectral vs. generic regularization. See Status.</text>
</svg>

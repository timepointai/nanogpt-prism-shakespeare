    <line x1="92" y1="456.8" x2="856" y2="456.8" stroke="#1e293b" stroke-width="1"/>
    <text x="84" y="153" text-anchor="end">2.4</text>
    <text x="84" y="230" text-anchor="end">2.2</text>
    <text x="84" y="307" text-anchor="end">2.0</text>
    <text x="84" y="384" text-anchor="end">1.8</text>
    <text x="84" y="460" text-anchor="end">1.6</text>
